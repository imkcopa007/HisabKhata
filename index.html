<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokan Hisab - Final Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-[#f5fdf7]">
<div class="max-w-7xl mx-auto p-4">
<header class="flex justify-between items-center bg-white p-4 rounded-2xl shadow mb-4">
<h1 class="text-xl font-bold text-emerald-700">🏪 দোকান হিসাব</h1>
<div class="flex gap-2"><button id="addEmpBtn" class="border px-4 py-2 rounded-xl text-sm bg-white">+ কর্মচারী</button><button id="addEntryBtn" class="bg-emerald-600 text-white px-5 py-2 rounded-xl font-bold">+ দৈনিক এন্ট্রি</button></div>
</header>

<div class="flex gap-2 mb-4 flex-wrap">
<input type="month" id="monthPicker" class="border rounded-xl px-3 py-2 bg-white">
<select id="filterEmp" class="border rounded-xl px-3 py-2 bg-white"><option value="all">সকল কর্মচারী</option></select>
<button id="exportBtn" class="ml-auto bg-slate-800 text-white px-4 py-2 rounded-xl text-sm">CSV Download</button>
</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
<div class="bg-white p-5 rounded-2xl shadow"><p class="text-sm text-slate-500">মোট সেল</p><h2 id="totalSell" class="text-xl font-bold text-emerald-600">৳0</h2></div>
<div class="bg-white p-5 rounded-2xl shadow"><p class="text-sm text-slate-500">মোট খরচ</p><h2 id="totalCost" class="text-xl font-bold text-orange-600">৳0</h2></div>
<div class="bg-white p-5 rounded-2xl shadow"><p class="text-sm text-slate-500">নেট</p><h2 id="netProfit" class="text-xl font-bold">৳0</h2></div>
<div class="bg-white p-5 rounded-2xl shadow"><p class="text-sm text-slate-500">টার্গেট পূরণ</p><h2 id="targetDone" class="text-xl font-bold">0 জন</h2></div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 space-y-6">
<div class="bg-white p-6 rounded-2xl shadow"><canvas id="perfChart" height="300"></canvas></div>
<div class="bg-white p-6 rounded-2xl shadow">
<h3 class="font-bold mb-3">1 মাসের Complete হিসাব</h3>
<div class="overflow-auto">
<table class="w-full text-[12px] border">
<thead class="bg-emerald-50"><tr><th class="p-2 border">কর্মচারী</th><th class="p-2 border">টার্গেট</th><th class="p-2 border">সেল</th><th class="p-2 border">খরচ</th><th class="p-2 border">বাকি টার্গেট</th><th class="p-2 border">এক্সট্রা</th><th class="p-2 border">স্ট্যাটাস</th></tr></thead>
<tbody id="empTable"></tbody>
<tfoot class="bg-slate-800 text-white font-bold"><tr><td class="p-2 border">মোট</td><td class="p-2 border text-center" id="fTotalTarget">৳0</td><td class="p-2 border text-center" id="fTotalSell">৳0</td><td class="p-2 border text-center" id="fTotalCost">৳0</td><td class="p-2 border text-center" id="fTotalBaki">৳0</td><td class="p-2 border text-center" id="fTotalExtra">৳0</td><td class="p-2 border"></td></tr></tfoot>
</table>
</div>
</div>
</div>
<div class="space-y-6">
<div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold mb-3">কর্মচারী লিস্ট</h3><div id="empList" class="space-y-2"></div></div>
<div class="bg-white p-5 rounded-2xl shadow"><h3 class="font-bold mb-3">আজকের এন্ট্রি</h3><div id="recentEntry" class="space-y-2 max-h-[500px] overflow-auto"></div></div>
</div>
</div>
</div>

<div id="empModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50"><div class="bg-white p-6 rounded-2xl w-full max-w-sm"><h3 class="font-bold mb-4">নতুন কর্মচারী</h3><form id="empForm" class="space-y-3"><input id="empName" required placeholder="নাম (Juwel)" class="w-full border rounded-xl px-4 py-3"><input id="empTarget" type="number" required placeholder="মাসিক টার্গেট 5000" class="w-full border rounded-xl px-4 py-3"><div class="flex gap-2"><button type="button" id="closeEmp" class="flex-1 border rounded-xl py-3">বাতিল</button><button class="flex-1 bg-emerald-600 text-white rounded-xl py-3">সেভ</button></div></form></div></div>

<div id="entryModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50"><div class="bg-white p-6 rounded-2xl w-full max-w-md"><h3 class="font-bold mb-4">দৈনিক এন্ট্রি</h3><form id="entryForm" class="space-y-3"><input id="entryDate" type="date" required class="w-full border rounded-xl px-4 py-3"><select id="entryEmp" required class="w-full border rounded-xl px-4 py-3"></select><input id="entrySell" type="number" required placeholder="আজ কত টাকার কাজ (Sell) - 1000" class="w-full border rounded-xl px-4 py-3"><input id="entryCost" type="number" required placeholder="আজ খরচ কত? - 100" class="w-full border rounded-xl px-4 py-3"><input id="entryNote" placeholder="নোট (কি কাজ)" class="w-full border rounded-xl px-4 py-3"><div class="flex gap-2"><button type="button" id="closeEntry" class="flex-1 border rounded-xl py-3">বাতিল</button><button class="flex-1 bg-emerald-600 text-white rounded-xl py-3 font-bold">সেভ</button></div></form></div></div>

<script>
const EMP_KEY='dokan_emp_final2', ENTRY_KEY='dokan_entry_final2';
let employees=JSON.parse(localStorage.getItem(EMP_KEY)||'[]');
let entries=JSON.parse(localStorage.getItem(ENTRY_KEY)||'[]');
const $=id=>document.getElementById(id);
let chart;
if(employees.length===0){ employees=[{id:1,name:'Juwel',target:5000},{id:2,name:'Karim',target:5000}]; localStorage.setItem(EMP_KEY,JSON.stringify(employees)); }
function saveEmp(){localStorage.setItem(EMP_KEY,JSON.stringify(employees));}
function saveEntry(){localStorage.setItem(ENTRY_KEY,JSON.stringify(entries));}
function fmt(n){return '৳'+Number(n).toLocaleString('bn-BD');}

function render(){
 const month=$('monthPicker').value || new Date().toISOString().slice(0,7);
 const filterEmp=$('filterEmp').value;
 const monthEntries=entries.filter(e=>e.date.startsWith(month));
 const filtered=filterEmp==='all'?monthEntries:monthEntries.filter(e=>e.empId==filterEmp);
 let totalSell=0,totalCost=0;
 filtered.forEach(e=>{totalSell+=e.sell; totalCost+=e.cost;});
 $('totalSell').innerText=fmt(totalSell); $('totalCost').innerText=fmt(totalCost);
 $('netProfit').innerText=fmt(totalSell-totalCost);
 const map={};
 employees.forEach(emp=>{ map[emp.id]={...emp, sell:0, cost:0}; });
 monthEntries.forEach(e=>{ if(map[e.empId]){ map[e.empId].sell+=e.sell; map[e.empId].cost+=e.cost; } });
 const empArray=Object.values(map);
 let done=0, tTarget=0, tSell=0, tCost=0, tBaki=0, tExtra=0;
 empArray.forEach(emp=>{ if(emp.sell>=emp.target) done++; });
 $('targetDone').innerText=`${done} জন`;
 let html='';
 empArray.forEach(emp=>{
  const baki = emp.target - emp.sell;
  const extra = emp.sell - emp.target;
  let bakiText, extraText, status, rowClass='';
  if(baki>0){ bakiText=`৳${baki.toLocaleString('bn-BD')} বাকি`; extraText=`-`; status=`🔴 বাকি`; rowClass=''; tBaki+=baki; }
  else if(baki===0){ bakiText=`0`; extraText=`-`; status=`✅ পূরণ`; rowClass='bg-emerald-50'; }
  else { bakiText=`0`; extraText=`+ ৳${extra.toLocaleString('bn-BD')}`; status=`🌟 বেশি`; rowClass='bg-green-100'; tExtra+=extra; }
  tTarget+=emp.target; tSell+=emp.sell; tCost+=emp.cost;
  html+=`<tr class="${rowClass}"><td class="p-2 border font-bold">${emp.name}</td><td class="p-2 border text-center">${fmt(emp.target)}</td><td class="p-2 border text-center font-bold text-emerald-700">${fmt(emp.sell)}</td><td class="p-2 border text-center text-orange-600">${fmt(emp.cost)}</td><td class="p-2 border text-center font-bold ${baki>0?'text-orange-600':'text-slate-400'}">${bakiText}</td><td class="p-2 border text-center font-bold text-emerald-700">${extraText}</td><td class="p-2 border text-center text-[11px]">${status}</td></tr>`;
 });
 $('empTable').innerHTML=html;
 $('fTotalTarget').innerText=fmt(tTarget); $('fTotalSell').innerText=fmt(tSell); $('fTotalCost').innerText=fmt(tCost); $('fTotalBaki').innerText=fmt(tBaki); $('fTotalExtra').innerText=fmt(tExtra);
 $('empList').innerHTML=employees.map(e=>`<div class="flex justify-between border p-2 rounded-xl text-sm bg-slate-50"><span>${e.name}<br><small>${fmt(e.target)} টার্গেট</small></span><button onclick="delEmp(${e.id})" class="text-red-400 text-xs">মুছুন</button></div>`).join('');
 $('recentEntry').innerHTML=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30).map(en=>{const emp=employees.find(x=>x.id==en.empId); return `<div class="border p-2 rounded-xl text-sm flex justify-between"><span>${en.date} • ${emp?emp.name:''}<br><small class="text-slate-500">${en.note||''}</small></span><span class="text-right"><b class="text-emerald-600">${fmt(en.sell)}</b><br><small class="text-orange-600">খরচ ${fmt(en.cost)}</small></span></div>`;}).join('');
 $('filterEmp').innerHTML='<option value="all">সকল কর্মচারী</option>'+employees.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
 $('filterEmp').value=filterEmp;
 $('entryEmp').innerHTML=employees.map(e=>`<option value="${e.id}">${e.name} - টার্গেট ${e.target}</option>`).join('');
 if(chart) chart.destroy();
 chart=new Chart($('perfChart'),{type:'bar', data:{labels:empArray.map(e=>e.name), datasets:[{label:'সেল', data:empArray.map(e=>e.sell), backgroundColor:'#059669'}, {label:'খরচ', data:empArray.map(e=>e.cost), backgroundColor:'#f97316'}, {label:'টার্গেট', data:empArray.map(e=>e.target), backgroundColor:'#e5e7eb'}]}, options:{responsive:true, plugins:{legend:{position:'bottom'}}}});
}
window.delEmp=(id)=>{ if(confirm('মুছবেন?')){ employees=employees.filter(e=>e.id!==id); entries=entries.filter(e=>e.empId!==id); saveEmp(); saveEntry(); render(); } };
$('addEmpBtn').onclick=()=>{ $('empModal').classList.remove('hidden'); $('empModal').classList.add('flex'); };
$('closeEmp').onclick=()=> $('empModal').classList.add('hidden');
$('empForm').onsubmit=e=>{ e.preventDefault(); employees.push({id:Date.now(), name:$('empName').value, target:Number($('empTarget').value)}); saveEmp(); $('empModal').classList.add('hidden'); e.target.reset(); render(); };
$('addEntryBtn').onclick=()=>{ $('entryModal').classList.remove('hidden'); $('entryModal').classList.add('flex'); $('entryDate').valueAsDate=new Date(); };
$('closeEntry').onclick=()=> $('entryModal').classList.add('hidden');
$('entryForm').onsubmit=e=>{ e.preventDefault(); entries.push({id:Date.now(), date:$('entryDate').value, empId:Number($('entryEmp').value), sell:Number($('entrySell').value), cost:Number($('entryCost').value||0), note:$('entryNote').value}); saveEntry(); $('entryModal').classList.add('hidden'); e.target.reset(); render(); };
$('monthPicker').value=new Date().toISOString().slice(0,7);
$('monthPicker').onchange=render; $('filterEmp').onchange=render;
$('exportBtn').onclick=()=>{ let csv='date,employee,sell,cost,baki,extra,note\n'+entries.map(e=>{const emp=employees.find(x=>x.id==e.empId); const sellTotal=entries.filter(x=>x.empId==e.empId && x.date.startsWith(e.date.slice(0,7))).reduce((s,x)=>s+x.sell,0); const baki=(emp?emp.target:0)-sellTotal; const extra=sellTotal-(emp?emp.target:0); return `${e.date},${emp?emp.name:''},${e.sell},${e.cost},${baki>0?baki:0},${extra>0?extra:0},${e.note}`;}).join('\n'); let b=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='dokan-hisab.csv'; a.click(); };
render();
</script>
</body>
</html>
